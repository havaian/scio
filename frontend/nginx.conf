server {
  listen 80;
  root /usr/share/nginx/html;

  # API and HTML reports are served by the backend container.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_read_timeout 300s;
  }

  # SPA routes (/findings, /quality, ...) fall back to index.html.
  location / {
    try_files $uri /index.html;
  }
}
